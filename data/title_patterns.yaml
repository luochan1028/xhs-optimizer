# 标题句式库（小红书高点击通用句式，自行总结，持续可扩展）
patterns:
  - name: 数字+痛点+结果
    template: "{kw}：{n}个{痛点}，{方法}后{结果}"
    example: "减脂：3个熬夜习惯，戒掉后瘦了8斤"
    tip: "数字放前，痛点具体，结果可验证"
  - name: 悬念反问
    template: "{人群}还在{错误做法}？{kw}{正确做法}才是答案"
    example: "打工人还在点外卖？15分钟快手减脂餐才是答案"
    tip: "用反问制造认知冲突"
  - name: 身份揭秘
    template: "{身份}不会告诉你的{kw}秘密"
    example: "健身教练不会告诉你的减脂餐秘密"
    tip: "身份越具体可信度越高"
  - name: 对比反差
    template: "花{小钱}办{大事}：{kw}{具体成果}"
    example: "花50块办大事：减脂餐一周不重样"
    tip: "小钱办大事是小红书永恒流量密码"
  - name: 时间+改变
    template: "{时间}，我靠{kw}{改变}"
    example: "30天，我靠减脂餐瘦了8斤"
    tip: "时间越短、改变越大，点击越高"
  - name: 避雷指南
    template: "{kw}避雷：{n}个坑别踩"
    example: "减脂避雷：5个坑别踩"
    tip: "利他型标题，收藏率最高"
