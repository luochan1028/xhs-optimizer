<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>xhs-zhenduan 在线试用：发笔记前，先诊断一下</title>
<style>
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;max-width:720px;margin:0 auto;padding:20px 16px;color:#222}
h1{font-size:20px} h2{font-size:16px;margin:18px 0 6px}
input,textarea,select{width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;font-size:15px;box-sizing:border-box}
textarea{min-height:180px}
button{background:#ff2442;color:#fff;border:0;border-radius:8px;padding:12px 28px;font-size:16px;cursor:pointer}
.score{font-size:40px;font-weight:700}.ok{color:#1a9e4b}.mid{color:#d48806}.bad{color:#d4380d}
ul{padding-left:20px;line-height:1.7}.dim{font-weight:700}
.note{color:#666;font-size:13px;line-height:1.6}
</style></head><body>
<h1>发笔记前，先诊断一下</h1>
<p class="note">xhs-zhenduan 在线试用：和本地版同一套评分规则（标题 30 / 正文 25 / 标签 15 / 合规 20），浏览器里直接跑，不上传、不收费。80 分以上再发，60 分以下先改。</p>
<h2>标题</h2><input id="title" placeholder="例如：简历上这3个错误，HR一眼就筛掉你">
<h2>正文（标签直接写正文里，如 #求职）</h2>
<textarea id="body" placeholder="第一行之后写正文，分段、加 emoji、结尾加一句提问，分数会更高"></textarea>
<h2>垂类</h2><select id="niche"></select>
<h2>核心关键词（逗号分隔）</h2><input id="keywords" placeholder="例如：简历,HR,面试">
<p><button onclick="run()">开始诊断</button></p>
<div id="out"></div>
<script>
var DATA = {"niches": {"美妆": ["美妆", "化妆教程", "平价好物", "护肤分享", "素颜", "新手化妆", "国货之光"], "美食": ["美食教程", "快手菜", "减脂餐", "烘焙", "一人食", "家常菜", "深夜食堂"], "职场": ["职场干货", "求职", "转行", "打工人日常", "升职加薪", "面试技巧"], "学习": ["学习方法", "考研", "考证", "自律", "英语学习", "学霸笔记"], "搞钱": ["副业搞钱", "搞钱思路", "自媒体", "轻创业", "被动收入", "搞钱女孩"], "穿搭": ["穿搭分享", "ootd", "平价穿搭", "微胖穿搭", "通勤穿搭", "今日穿搭"], "旅行": ["旅行攻略", "特种兵旅游", "穷游", "民宿推荐", "城市漫步", "旅行拍照"], "家居": ["家居分享", "出租屋改造", "收纳", "极简生活", "软装", "宅家好物"], "母婴": ["母婴好物", "带娃日常", "科学育儿", "辅食教程", "新手妈妈"], "数码": ["数码好物", "AI工具", "效率神器", "手机摄影", "电脑技巧"]}, "patterns": [{"name": "数字+痛点+结果", "template": "{kw}：{n}个{痛点}，{方法}后{结果}", "example": "减脂：3个熬夜习惯，戒掉后瘦了8斤", "tip": "数字放前，痛点具体，结果可验证"}, {"name": "悬念反问", "template": "{人群}还在{错误做法}？{kw}{正确做法}才是答案", "example": "打工人还在点外卖？15分钟快手减脂餐才是答案", "tip": "用反问制造认知冲突"}, {"name": "身份揭秘", "template": "{身份}不会告诉你的{kw}秘密", "example": "健身教练不会告诉你的减脂餐秘密", "tip": "身份越具体可信度越高"}, {"name": "对比反差", "template": "花{小钱}办{大事}：{kw}{具体成果}", "example": "花50块办大事：减脂餐一周不重样", "tip": "小钱办大事是小红书永恒流量密码"}, {"name": "时间+改变", "template": "{时间}，我靠{kw}{改变}", "example": "30天，我靠减脂餐瘦了8斤", "tip": "时间越短、改变越大，点击越高"}, {"name": "避雷指南", "template": "{kw}避雷：{n}个坑别踩", "example": "减脂避雷：5个坑别踩", "tip": "利他型标题，收藏率最高"}], "risks": ["微信", "加微信", "加V", "私聊我", "私信我", "点击链接", "购买链接", "下单", "最便宜", "最有效", "第一", "顶级", "国家级", "绝无仅有", "史无前例", "日赚", "月入过万", "保证赚钱", "根治", "治愈", "偏方", "祖传秘方", "退款", "返现"], "times": {"general": [{"time": "12:00-13:30", "note": "午休刷手机高峰，适合干货/教程类"}, {"time": "18:00-20:00", "note": "下班通勤高峰，适合轻松向/美食类"}, {"time": "21:00-23:00", "note": "睡前高峰，全天流量最大，重要笔记首选"}], "weekend": [{"time": "周末 10:00-11:30", "note": "上午种草高峰，适合探店/旅行/穿搭类"}], "tip": "新号建议固定1-2个时段连续发7天，测出自己账号的最佳时间"}};
// xhs-optimizer 诊断引擎（JS 版）
// 与 scripts/optimize.py 同一套评分规则逐项对照移植，
// 唯一差别：不含 --cover 封面初检与 --style 对标改写（在线试用不需要）。
// 字符数按 code point 计（Array.from），与 Python len() 一致。
(function (root) {
  'use strict';

  var DIGITS = /\d+/;
  var EMOJI = /[\u{1F300}-\u{1FAFF}\u2600-\u27BF\u2B00-\u2BFF]/gu;
  var INTERACT = /(你们|姐妹们|评论区|留言|投票|你怎么看|试过吗|有用吗)/;
  var CLICKBAIT_OVER = /(震惊|竟然|天啊|救命|离谱|吓死)/;
  var HOOK_KEYS = ['怎么', '为什么', '避雷', '秘密', '天', '块'];
  var TIME_UNITS = ['天', '周', '月', '年', '小时', '分钟'];

  function charLen(s) { return Array.from(s.replace(/\s+/g, '')).length; }

  function diagnoseTitle(title, patterns) {
    var score = 30, notes = [];
    var n = Array.from(title).length;
    if (n <= 20) notes.push('✅ 标题 ' + n + ' 字，长度合适（小红书标题建议≤20字）');
    else { score -= 8; notes.push('⚠️ 标题 ' + n + ' 字偏长，信息流中会被折叠，建议压缩到20字内'); }
    if (DIGITS.test(title)) notes.push('✅ 含数字，具体感强');
    else { score -= 4; notes.push('⚠️ 标题无数字，加上具体数字点击率更高'); }
    if (title.indexOf('?') !== -1 || title.indexOf('？') !== -1 || title.indexOf('!') !== -1 || title.indexOf('！') !== -1)
      notes.push('✅ 有疑问/感叹语气，情绪钩子到位');
    else { score -= 3; notes.push('⚠️ 缺情绪钩子，试试反问或感叹句式'); }
    if (CLICKBAIT_OVER.test(title)) { score -= 5; notes.push('⚠️ 标题党词汇过重，易被限流且伤信任'); }
    var hit = patterns.filter(function (p) {
      return HOOK_KEYS.some(function (k) { return title.indexOf(k) !== -1; });
    });
    notes.push(hit.length ? '✅ 命中高点击句式特征' : 'ℹ️ 未明显命中高点击句式，见下方改写建议');
    return { score: Math.max(score, 0), notes: notes };
  }

  function diagnoseBody(body) {
    var score = 25, notes = [];
    var n = charLen(body);
    if (n >= 300 && n <= 800) notes.push('✅ 正文 ' + n + ' 字，信息量适中');
    else if (n < 300) { score -= 6; notes.push('⚠️ 正文仅 ' + n + ' 字，偏单薄，加细节/过程/感受'); }
    else { score -= 4; notes.push('⚠️ 正文 ' + n + ' 字偏长，注意分段，重点前置'); }
    var paras = body.split('\n').filter(function (p) { return p.trim(); });
    if (paras.length >= 3) notes.push('✅ 分 ' + paras.length + ' 段，阅读节奏好');
    else { score -= 4; notes.push('⚠️ 几乎没分段，手机端阅读压力大，回车分段'); }
    var em = (body.match(EMOJI) || []).length;
    if (em >= 3) notes.push('✅ emoji ' + em + ' 个，氛围感够');
    else if (em > 0) notes.push('ℹ️ emoji ' + em + ' 个，可再加2-3个作段落分隔');
    else { score -= 3; notes.push('⚠️ 零 emoji，小红书体感偏"严肃"，适当加'); }
    if (INTERACT.test(body)) notes.push('✅ 有互动引导（提问/喊话），利评论区');
    else { score -= 4; notes.push('⚠️ 无互动引导，结尾加一句提问（如\'你们试过吗\'）'); }
    return { score: Math.max(score, 0), notes: notes };
  }

  function diagnoseTags(body, niche, tagsDb) {
    var score = 15, notes = [], rec = [];
    var found = (body.match(/#(\S+)/g) || []).map(function (t) { return t.slice(1); });
    if (found.length >= 3 && found.length <= 8) notes.push('✅ 标签 ' + found.length + ' 个，数量合适');
    else if (found.length < 3) { score -= 6; notes.push('⚠️ 只有 ' + found.length + ' 个标签，曝光入口太少'); }
    else { score -= 3; notes.push('⚠️ ' + found.length + ' 个标签偏多，堆砌会被降权'); }
    if (tagsDb[niche]) {
      rec = tagsDb[niche].filter(function (t) { return found.indexOf(t) === -1; }).slice(0, 8 - found.length);
      if (rec.length) notes.push('💡 推荐补标签：' + rec.map(function (t) { return '#' + t; }).join(' '));
    }
    return { score: Math.max(score, 0), notes: notes, found: found, rec: rec };
  }

  function diagnoseRisk(text, risks) {
    var score = 20, notes = [];
    var hit = risks.filter(function (w) { return text.indexOf(w) !== -1; });
    if (!hit.length) notes.push('✅ 未命中风险词库');
    else {
      score -= Math.min(5 * hit.length, 18);
      notes.push('🚨 命中风险词 ' + hit.length + ' 个：' + hit.join('、'));
      notes.push("   → 站外引流词（微信/私聊）易限流，改'主页简介有方式'；极限词改温和表达");
    }
    return { score: Math.max(score, 0), notes: notes };
  }

  function pickNumbers(keywords) {
    var joined = keywords.join('');
    var nums = joined.match(/\d+/g) || [];
    for (var i = 0; i < nums.length; i++) {
      var n = nums[i];
      var bad = TIME_UNITS.some(function (u) { return joined.indexOf(n + u) !== -1; });
      if (!bad) return n;
    }
    return nums.length ? nums[0] : '3';
  }

  function pickTimes(keywords) {
    for (var i = 0; i < keywords.length; i++) {
      var k = keywords[i];
      if (TIME_UNITS.some(function (u) { return k.indexOf(u) !== -1; })) return k;
    }
    return '30天';
  }

  function rewriteTitles(keywords, patterns) {
    var kw = keywords[0] || '关键词';
    var fill = { '{kw}': kw, '{n}': pickNumbers(keywords), '{时间}': pickTimes(keywords) };
    return patterns.slice(0, 3).map(function (p) {
      var t = p.template, missing = [];
      (t.match(/\{[^}]+\}/g) || []).forEach(function (slot) {
        if (fill[slot] !== undefined) t = t.split(slot).join(fill[slot]);
        else { missing.push(slot.replace(/[{}]/g, '')); t = t.split(slot).join('…'); }
      });
      return { name: p.name, title: t, missing: missing, tip: p.tip, example: p.example };
    });
  }

  function diagnose(title, body, niche, keywords, DATA) {
    var s1 = diagnoseTitle(title, DATA.patterns);
    var s2 = diagnoseBody(body);
    var s3 = diagnoseTags(body, niche, DATA.niches);
    var s4 = diagnoseRisk(title + '\n' + body, DATA.risks);
    var total = s1.score + s2.score + s3.score + s4.score;
    var verdict = total >= 80 ? '优秀，直接发' : total >= 60 ? '可发，建议按下面优化' : '先改再发';
    return {
      total: total, verdict: verdict,
      dims: { title: s1.score, body: s2.score, tags: s3.score, risk: s4.score },
      notes: { title: s1.notes, body: s2.notes, tags: s3.notes, risk: s4.notes },
      rewrites: rewriteTitles(keywords, DATA.patterns),
      tagPool: (DATA.niches[niche] || []).slice(0, 8),
      times: DATA.times
    };
  }

  var api = { diagnose: diagnose };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.XhsSkill = api;
})(typeof window !== 'undefined' ? window : globalThis);

var sel = document.getElementById('niche');
Object.keys(DATA.niches).forEach(function (k) {
  var o = document.createElement('option'); o.text = k; o.value = k; sel.add(o);
});
sel.value = '职场';
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function run(){
  var title = document.getElementById('title').value.trim();
  var body = document.getElementById('body').value.trim();
  var niche = sel.value;
  var kw = document.getElementById('keywords').value.split(/[,，、\s]+/).filter(Boolean);
  if(!title || !body){ alert('标题和正文都填一下再诊断'); return; }
  var r = XhsSkill.diagnose(title, body, niche, kw, DATA);
  var cls = r.total >= 80 ? 'ok' : r.total >= 60 ? 'mid' : 'bad';
  var h = '<h2>综合评分：<span class="score ' + cls + '">' + r.total + ' / 100</span> ' + esc(r.verdict) + '</h2>';
  h += '<ul><li><span class="dim">标题吸引力：' + r.dims.title + '/30</span><ul>' + r.notes.title.map(function (n){return '<li>'+esc(n)+'</li>';}).join('') + '</ul></li>';
  h += '<li><span class="dim">正文质量：' + r.dims.body + '/25</span><ul>' + r.notes.body.map(function (n){return '<li>'+esc(n)+'</li>';}).join('') + '</ul></li>';
  h += '<li><span class="dim">标签曝光：' + r.dims.tags + '/15</span><ul>' + r.notes.tags.map(function (n){return '<li>'+esc(n)+'</li>';}).join('') + '</ul></li>';
  h += '<li><span class="dim">合规安全：' + r.dims.risk + '/20</span><ul>' + r.notes.risk.map(function (n){return '<li>'+esc(n)+'</li>';}).join('') + '</ul></li></ul>';
  h += '<h2>标题改写建议</h2><ul>' + r.rewrites.map(function (w){
    return '<li><b>' + esc(w.name) + '：</b>' + esc(w.title) + (w.missing.length ? '（缺：' + esc(w.missing.join('、')) + '，补上对应关键词）' : '') + '<br><span class="note">' + esc(w.tip) + ' 例：' + esc(w.example) + '</span></li>';
  }).join('') + '</ul>';
  h += '<h2>发布时间建议</h2><ul>' + r.times.general.map(function (t){return '<li>'+esc(t)+'</li>';}).join('') + '<li>' + esc(r.times.weekend) + '</li><li>' + esc(r.times.tip) + '</li></ul>';
  h += '<p class="note">风险词库是示例版，命中请人工复核。本地版（可改规则、批量跑、生成 HTML 诊断卡片）见 CodeArts 代码仓 xhs-optimizer。</p>';
  document.getElementById('out').innerHTML = h;
}
</script></body></html>
